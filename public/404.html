<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dawood Khatri | Full Stack Developer</title>
    <!--
      GitHub Pages has no server-side routing, so a direct visit or refresh
      on a route like /certifications 404s. This redirects that request
      back to index.html with the path encoded in the query string; the
      matching script in index.html restores the real URL on load.
      (Pattern: https://github.com/rafgraph/spa-github-pages)
    -->
    <script type="text/javascript">
      var segmentCount = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + segmentCount)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(segmentCount)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
